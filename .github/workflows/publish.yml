name: Publish Extension

on:
  workflow_dispatch:
  pull_request:
    branches: ["!main"]
  schedule:
    # At 14:15 on day-of-month 1 (UTC+0)
    - cron: "15 14 1 * *"

permissions:
  contents: write

jobs:
  publish:
    name: Publish to VSCode Marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: "npm"
      - run: npm ci
      - name: Publish to VSCode Marketplace
        if: success()
        env:
          VSCE_PAT: ${{ secrets.AZURE_TOKEN }}
        run: |
          npx @vscode/vsce publish
